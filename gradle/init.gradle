// Gradle Initialization Script for Zenith Android TV
// Handles proxy and restricted network environment

allprojects {
    repositories {
        // Maven Central - most reliable in restricted environments
        mavenCentral() {
            content {
                excludeGroupByRegex("com\\.android.*")
                excludeGroupByRegex("com\\.google.*")
                excludeGroupByRegex("androidx.*")
            }
        }

        // Maven Central as comprehensive fallback
        maven {
            url = uri("https://repo.maven.apache.org/maven2/")
            allowInsecureProtocol = false
            content {
                includeGroupByRegex(".*")
            }
        }

        // Gradle Plugin Portal
        gradlePluginPortal()

        // Google as last resort (may fail due to organization proxy policy)
        try {
            google() {
                allowInsecureProtocol = false
            }
        } catch (Exception e) {
            logger.warn("Google Maven repository not accessible: ${e.message}")
        }
    }
}
